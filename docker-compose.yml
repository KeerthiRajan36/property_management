version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: property_admin
      POSTGRES_PASSWORD: property_pass
      POSTGRES_DB: property_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_admin -d property_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://property_admin:property_pass@db:5432/property_management
      SECRET_KEY: change_me_in_production
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  pgdata:
